---

- name: Install additional packages
  ansible.builtin.apt:
    update_cache: "{{ update_apt_cache }}"
    state: present
    name:
      - libcurl4-gnutls-dev
      - gnutls-dev
      - libpq-dev
      - "{{ virtualenv_python_version + '-dev' }}"
      - "{{ virtualenv_python_version + '-venv' }}"
