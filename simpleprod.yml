---

# - ansible.builtin.import_playbook: logservers.yml

- name: Provision standalone base functionality servers
  hosts: lovelace
  become: true
  become_user: root
  remote_user: "{{ server_user }}"
  vars:
    update_apt_cache: true
    server_role: "lovelace-main"
  module_defaults:
    ansible.builtin.apt:
      force_apt_get: true

  roles:
    - base
#    - logclient
    - geerlingguy.redis
    - db
    - supervisor
    - lovelace
    - gunicorn
    - nginx
    - certbot
#    - node_exporter

# - ansible.builtin.import_playbook: gateway.yml
